name: release

on:
  workflow_dispatch:
    inputs:
      ncs_version:
        description: nRF Connect SDK version to build against (selects the build-base image tag)
        required: true
        default: zb-r23-1.3.0
      version:
        description: 'Release version, without the leading "v" (default: CalVer YYYY.MM.DD.<run_number>)'
        required: false

permissions:
  contents: write
  packages: read

jobs:
  build:
    uses: BeeEyeIoT/pipelines/.github/workflows/build-firmware.yml@v3
    with:
      ncs_version: ${{ inputs.ncs_version }}
      board: MPsensor/nrf54l15/cpuapp      
      use_sysbuild: true
      extra_cmake_args: -GNinja
    secrets:
      mcuboot_key_pem: ${{ secrets.MCUBOOT_KEY_PEM }}

  release:
    needs: build
    uses: BeeEyeIoT/pipelines/.github/workflows/release-firmware.yml@v3
    with:
      version: ${{ inputs.version }}
